name: CI
on:
  push:
    branches: [develop]
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libdbus-1-dev libssl-dev

      - name: Prepare frontendDist for Tauri compile
        shell: bash
        run: |
          mkdir -p dist
          if [ ! -f dist/index.html ]; then
            printf '%s\n' \
              '<!doctype html>' \
              '<html>' \
              '  <head>' \
              '    <meta charset="utf-8" />' \
              '    <title>CI placeholder</title>' \
              '  </head>' \
              '  <body></body>' \
              '</html>' \
              > dist/index.html
          fi

      - name: Build
        working-directory: src-tauri
        run: cargo build --release

      - name: Run tests
        working-directory: src-tauri
        run: cargo test
